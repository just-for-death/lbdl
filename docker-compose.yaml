version: '3.8'

# lbdl — local development / self-hosted compose
#
# Data is stored in named Docker volumes by default.
# To use host-directory bind mounts instead, replace the named volume entries
# under each service's "volumes:" section with absolute host paths, e.g.:
#   - /your/music/path:/app/music
#   - /your/config/path:/app/config
#
# Quick start:
#   docker compose build && docker compose up -d
#   Open http://localhost:8032

services:

  lbdl-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lbdl-api
    ports:
      - "8032:8032"
    environment:
      - LBDL_DATA_DIR=/app/music
      - LBDL_CONFIG_DIR=/app/config
      - LBDL_YTDLP_DIR=/app/config
      - LBDL_AUDIO_FORMAT=opus
      - LBDL_AUDIO_QUALITY=0
      - LBDL_SCHEDULER_CRON=0 */2 * * *
      - LBDL_ACOUSTID_KEY=${LBDL_ACOUSTID_KEY:-}
      - LBDL_LB_TOKEN=${LBDL_LB_TOKEN:-}
      - LBDL_INVIDIOUS_INSTANCE=${LBDL_INVIDIOUS_INSTANCE:-https://inv.nadeko.net}
      - LBDL_TZ=${TZ:-UTC}
      # Optional: require this token for all /api/* and /ws/* (web UI + scripts). Generate: openssl rand -hex 32
      - LBDL_API_TOKEN=${LBDL_API_TOKEN:-}
      # Set to 1 when serving the UI only over HTTPS so the session cookie is Secure
      - LBDL_COOKIE_SECURE=${LBDL_COOKIE_SECURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lbdl-music:/app/music
      - lbdl-config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8032/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lbdl-network
    restart: unless-stopped

  lbdl-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: lbdl-sync
    environment:
      - LBDL_DATA_DIR=/app/music
      - LBDL_CONFIG_DIR=/app/config
      - LBDL_YTDLP_DIR=/app/config
      - LBDL_AUDIO_FORMAT=opus
      - LBDL_AUDIO_QUALITY=0
      - LBDL_SCHEDULER_CRON=${LBDL_SCHEDULER_CRON:-0 */2 * * *}
      - LBDL_TZ=${TZ:-UTC}
    volumes:
      - lbdl-music:/app/music
      - lbdl-config:/app/config
    networks:
      - lbdl-network
    restart: unless-stopped

  # ── Optional background worker services ─────────────────────────────────────
  # These are NOT required for normal operation. The API downloads inline.
  # Start with:  docker compose --profile workers up -d

  lbdl-redis:
    image: redis:7-alpine
    container_name: lbdl-redis
    profiles: ["workers"]
    volumes:
      - lbdl-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lbdl-network

  lbdl-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lbdl-rabbitmq
    profiles: ["workers"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - lbdl-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lbdl-network

  lbdl-downloader:
    build:
      context: .
      dockerfile: Dockerfile.downloader
    container_name: lbdl-downloader
    profiles: ["workers"]
    environment:
      - LBDL_DATA_DIR=/app/music
      - LBDL_CONFIG_DIR=/app/config
      - LBDL_YTDLP_DIR=/app/config
      - REDIS_URL=redis://lbdl-redis:6379/0
      - QUEUE_URL=amqp://guest:guest@lbdl-rabbitmq:5672//
      - WORKER_CONCURRENCY=3
    volumes:
      - lbdl-music:/app/music
      - lbdl-config:/app/config
    depends_on:
      lbdl-redis:
        condition: service_healthy
      lbdl-rabbitmq:
        condition: service_healthy
    networks:
      - lbdl-network

  lbdl-tagger:
    build:
      context: .
      dockerfile: Dockerfile.tagger
    container_name: lbdl-tagger
    profiles: ["workers"]
    environment:
      - LBDL_DATA_DIR=/app/music
      - LBDL_CONFIG_DIR=/app/config
      - REDIS_URL=redis://lbdl-redis:6379/0
      - QUEUE_URL=amqp://guest:guest@lbdl-rabbitmq:5672//
      - WORKER_CONCURRENCY=2
      - LBDL_ACOUSTID_KEY=${LBDL_ACOUSTID_KEY:-}
    volumes:
      - lbdl-music:/app/music
      - lbdl-config:/app/config
    depends_on:
      lbdl-redis:
        condition: service_healthy
      lbdl-rabbitmq:
        condition: service_healthy
    networks:
      - lbdl-network

volumes:
  lbdl-music:
  lbdl-config:
  lbdl-redis-data:
  lbdl-rabbitmq-data:

networks:
  lbdl-network:
    driver: bridge
