services:
  lbdl:
    build: .
    container_name: lbdl
    user: 0:0
    ports:
      - "8032:8000"
    environment:
      LBDL_SCHEDULER_CRON:     "0 */2 * * *"
      LBDL_TZ:                 UTC
      LBDL_AUDIO_FORMAT:       opus
      LBDL_AUDIO_QUALITY:      "0"
      LBDL_LB_TOKEN:           ""
      LBDL_INVIDIOUS_INSTANCE: "https://inv.nadeko.net"
      LBDL_LOG_LEVEL:          INFO     # DEBUG | INFO | WARNING | ERROR
      LBDL_LOG_FORMAT:         json     # json = Dozzle-parseable | text = human-readable
    volumes:
      - ./config:/app/config
      - ./music:/app/music
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Dozzle metadata — shows up in the Dozzle UI
      dozzle.name:        "lbdl"
      dozzle.description: "ListenBrainz & Invidious playlist downloader"
      dozzle.group:       "media"
      dozzle.icon:        "https://raw.githubusercontent.com/YOUR_USERNAME/lbdl/main/static/icon.svg"

  # Optional: uncomment to run Dozzle alongside lbdl
  # dozzle:
  #   image: amir20/dozzle:latest
  #   container_name: dozzle
  #   ports:
  #     - "9999:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   environment:
  #     DOZZLE_FILTER: "name=lbdl"
  #   restart: unless-stopped
